[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-ai"
version = "1.0.0"
description = "Advanced self-learning AI assistant powered by Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.2.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.7.0",
    "SpeechRecognition>=3.10.0",
    "pyttsx3>=2.90",
    "pyaudio>=0.2.14",
    "faster-whisper>=1.0.0",
    "duckduckgo-search>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]
